<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snake Game - Rắn Săn Mồi Hiện Đại</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <h1 class="game-title">
                <span class="snake-emoji">🐍</span>
                <span>SNAKE</span>
            </h1>
            <div class="score-panel">
                <div class="score-item">
                    <span class="score-label">ĐIỂM</span>
                    <span class="score-value" id="currentScore">0</span>
                </div>
                <div class="score-divider"></div>
                <div class="score-item">
                    <span class="score-label">CAO NHẤT</span>
                    <span class="score-value high-score" id="highScore">0</span>
                </div>
            </div>
        </header>

        <!-- Game Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Start Screen -->
            <div class="overlay" id="startScreen">
                <div class="overlay-content">
                    <div class="snake-logo">🐍</div>
                    <h2>SNAKE GAME</h2>
                    <p>Nhấn <kbd>SPACE</kbd> hoặc chạm để bắt đầu</p>
                    <div class="controls-hint">
                        <span>⬆️⬇️⬅️➡️ hoặc WASD để di chuyển</span>
                    </div>
                </div>
            </div>

            <!-- Pause Screen -->
            <div class="overlay hidden" id="pauseScreen">
                <div class="overlay-content">
                    <div class="pause-icon">⏸️</div>
                    <h2>TẠM DỪNG</h2>
                    <p>Nhấn <kbd>SPACE</kbd> hoặc <kbd>P</kbd> để tiếp tục</p>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div class="overlay hidden" id="gameOverScreen">
                <div class="overlay-content">
                    <div class="gameover-icon">💀</div>
                    <h2>GAME OVER</h2>
                    <div class="final-score">
                        <span>Điểm của bạn:</span>
                        <span class="final-score-value" id="finalScore">0</span>
                    </div>
                    <div class="new-record hidden" id="newRecord">
                        🏆 KỶ LỤC MỚI! 🏆
                    </div>
                    <p>Nhấn <kbd>SPACE</kbd> hoặc chạm để chơi lại</p>
                </div>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="mobile-controls" id="mobileControls">
            <button class="control-btn" data-direction="up">⬆️</button>
            <div class="control-row">
                <button class="control-btn" data-direction="left">⬅️</button>
                <button class="control-btn" data-direction="down">⬇️</button>
                <button class="control-btn" data-direction="right">➡️</button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="game-footer">
            <button class="btn-sound" id="soundToggle" title="Bật/Tắt âm thanh">
                🔊
            </button>
            <span class="footer-text">Sử dụng phím mũi tên hoặc cảm ứng</span>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/food.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
